[versions]
# Android Gradle Plugin - 8.13.x stable (9.0 is breaking change requiring DSL migration)
agp = "9.2.1"
kotlin = "2.3.21"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.05.01"
navigationCompose = "2.9.8"
androidxPalette = "1.0.0"
roomVersion = "2.8.4"
coilCompose = "3.4.0"
# KSP must match Kotlin version
ksp = "2.3.8"
zxing = "3.5.4"
gson = "2.14.0"
okhttp = "5.3.0"
securityCrypto = "1.1.0"
datastorePreferences = "1.2.1"
# Google Drive Backup
playServicesAuth = "21.5.1"
googleApiServicesDrive = "v3-rev20260428-2.0.0"
googleApiClientAndroid = "2.8.1"
googleHttpClientGson = "1.47.0"
workRuntimeKtx = "2.11.1"
paging = "3.4.1"
pdfboxAndroid = "2.0.27.0"
media3 = "1.10.0"
# Koog AI Agent Framework - latest stable (May 2026)
koog = "1.0.0"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
# Ktor - latest stable
ktor = "3.5.0"
# Code Quality
detekt = "1.23.8"
ktlint = "14.2.0"
googleServices = "4.4.4"
firebaseBom = "34.13.0"
crashlyticsPlugin = "3.0.7"
leakcanary = "2.14"
javaxInject = "1"
firebaseAdmin = "9.7.1"
exposed = "1.3.0"

[libraries]
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }
