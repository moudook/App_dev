espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"
roomVersion = "2.7.2"
coilCompose = "2.7.0"
ksp = "2.2.21-2.0.4"
zxing = "3.5.3"
gson = "2.11.0"
okhttp = "4.12.0"
securityCrypto = "1.1.0-alpha06"
