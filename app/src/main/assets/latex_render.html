<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        #content {
            padding: 8px;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .katex-display {
            margin: 0.5em 0 !important;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .katex {
            font-size: 1.1em;
        }
        /* Dark mode support via CSS custom properties */
        :root {
            --text-color: #000000;
            --display-color: #000000;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: #ffffff;
                --display-color: #ffffff;
            }
        }
    </style>
</head>
<body>
    <div id="content"></div>
    <script>
        // Initialize with dark mode detection
        function getTextColor() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                return '#ffffff';
            }
            return '#000000';
        }
        
        function renderLatex(latexString, isBlock, colorHex) {
            const contentDiv = document.getElementById('content');
            
            if (colorHex) {
                contentDiv.style.color = colorHex;
            } else {
                contentDiv.style.color = getTextColor();
            }
            
            try {
                if (isBlock) {
                    // Render as display math
                    katex.render(latexString, contentDiv, {
                        displayMode: true,
                        throwOnError: false,
                        errorColor: "#cc0000",
                        strict: false,
                        trust: true,
                        macros: {
                            "\\f": "#1f(##1)"
                        }
                    });
                } else {
                    // Render as inline math
                    katex.render(latexString, contentDiv, {
                        displayMode: false,
                        throwOnError: false,
                        errorColor: "#cc0000"
                    });
                }
                return { success: true };
            } catch (e) {
                return { success: false, error: e.message };
            }
        }
        
        // Listen for dark mode changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            // Reload current content if needed
        });
        
        // Signal that we're ready
        window.androidWebViewReady = true;
    </script>
</body>
</html>
