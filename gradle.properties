# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ==========================================
# JVM Memory Optimization for Build Speed
# ==========================================
# KSP2 runs in the Gradle daemon - requires higher heap allocation
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Enable parallel execution of independent modules
org.gradle.parallel=true

# Enable the configuration cache for faster builds
org.gradle.configuration-cache=true

# Enable file system watching for faster incremental builds
org.gradle.vfs.watch=true

# ==========================================
# AndroidX Configuration
# ==========================================
android.useAndroidX=true
# Disable Jetifier (assuming full AndroidX migration)
android.enableJetifier=false

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# ==========================================
# KSP (Kotlin Symbol Processing) Configuration
# ==========================================
# KSP2 enabled - requires Room 2.7.0+ for compatibility
ksp.useKSP2=true

# Enable incremental processing for KSP2
ksp.incremental=true
ksp.incremental.intermodule=true