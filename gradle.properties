# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ==========================================
# JVM Memory Optimization for Build Speed
# ==========================================
# KSP2 runs in the Gradle daemon - requires higher heap allocation
# Release builds with R8/D8 dex merging require 4GB+ heap
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Use Android Studio's bundled JDK
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Enable parallel execution of independent modules
org.gradle.parallel=true

# Disable configuration cache (causes serialization issues with large dependency maps)
org.gradle.configuration-cache=false

# Enable file system watching for faster incremental builds
org.gradle.vfs.watch=true

# ==========================================
# AndroidX Configuration
# ==========================================
android.useAndroidX=true
# Disable Jetifier (assuming full AndroidX migration)
android.enableJetifier=false

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Suppress Kotlin Multiplatform + AGP compatibility warning
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# ==========================================
# KSP (Kotlin Symbol Processing) Configuration
# ==========================================
# Enable incremental processing for KSP
ksp.incremental=true
ksp.incremental.intermodule=true

# Suppress compileSdk warning
android.suppressUnsupportedCompileSdk=35

# Disable classpath checking (causes serialization issues with large dependency maps)
android.enableClasspathSnapshotVerification=false

