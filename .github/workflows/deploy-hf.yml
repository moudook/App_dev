name: Deploy to Hugging Face Spaces

on:
  # Disabled - pushing directly to HF Space instead
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Add HF remote if not exists
          git remote add hf https://K1tt3n:$HF_TOKEN@huggingface.co/spaces/K1tt3n/Friday_server 2>/dev/null || true
           
           # Push to HF Spaces
           git push hf main --force
           
           echo "Deployed to https://huggingface.co/spaces/K1tt3n/Friday_server"