# Keep-Alive Workflow for Hugging Face Spaces
# Prevents Spaces from hibernating by pinging the endpoint

name: Keep Spaces Alive

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Hugging Face Space
        run: |
          # Ping the space to keep it awake
          curl -f https://K1tt3n-smarty-server.hf.space/api/health || echo "Space may be hibernated or down"
          
          # Also ping the Friday_server space if it exists
          curl -f https://K1tt3n-Friday_server.hf.space/api/health || echo "Friday_server space may be hibernated or down"
          
          echo "Keep-alive ping completed at $(date)"
