name: CI - Build, Lint & Verify

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"
  JAVA_VERSION: '17'

jobs:
  # ============================================
  # GRADLE VERIFICATION
  # ============================================
  gradle-verify:
    name: Verify Gradle Setup
    runs-on: ubuntu-latest
    outputs:
      gradle-version: ${{ steps.gradle-version.outputs.version }}
      wrapper-valid: ${{ steps.wrapper-check.outputs.valid }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Validate Gradle Wrapper
      id: wrapper-check
      run: |
        if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "valid=true" >> $GITHUB_OUTPUT
        else
          echo "Gradle wrapper not found"
          echo "valid=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Get Gradle Version
      id: gradle-version
      run: |
        VERSION=$(./gradlew --version | grep "Gradle" | cut -d' ' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Gradle version: $VERSION"

    - name: Verify Gradle Cache
      run: ./gradlew --version

  # ============================================
  # DEPENDENCY & VERSION CHECKS
  # ============================================
  dependency-check:
    name: Check Dependencies & Versions
    runs-on: ubuntu-latest
    needs: [gradle-verify]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check for Dependency Updates
      run: ./gradlew dependencyUpdates -Drevision=release --stacktrace || echo "Dependency update check completed"

    - name: Verify Kotlin Version
      run: |
        KOTLIN_VERSION=$(grep -oP "kotlin.*=.*\"\K[^\"]+" gradle/libs.versions.toml 2>/dev/null || echo "not found")
        echo "Kotlin version: $KOTLIN_VERSION"

    - name: Verify Android Gradle Plugin Version
      run: |
        AGP_VERSION=$(grep -oP "agp.*=.*\"\K[^\"]+" gradle/libs.versions.toml 2>/dev/null || echo "not found")
        echo "AGP version: $AGP_VERSION"

    - name: Generate Dependency Report
      run: ./gradlew :app:dependencies --stacktrace || true

  # ============================================
  # CODE QUALITY - LINT & DETEKT
  # ============================================
  code-quality:
    name: Code Quality (Lint & Detekt)
    runs-on: ubuntu-latest
    needs: [gradle-verify]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Android Lint
      id: lint
      run: ./gradlew lintDebug --stacktrace || echo "lint-failed=true" >> $GITHUB_OUTPUT

    - name: Upload Lint Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-reports
        path: |
          app/build/reports/lint/lint-results-debug.html
          app/build/reports/lint/lint-results-debug.xml
        retention-days: 14

    - name: Run Detekt (Static Analysis)
      id: detekt
      continue-on-error: true
      run: ./gradlew detekt --stacktrace || echo "detekt-failed=true" >> $GITHUB_OUTPUT

    - name: Upload Detekt Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: detekt-reports
        path: |
          app/build/reports/detekt/
          common/build/reports/detekt/
          server/build/reports/detekt/
        retention-days: 14

    - name: Check Import Order (ktlint)
      id: ktlint
      continue-on-error: true
      run: ./gradlew ktlintCheck --stacktrace || echo "ktlint-failed=true" >> $GITHUB_OUTPUT

    - name: Upload ktlint Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ktlint-reports
        path: |
          **/build/reports/ktlint/
        retention-days: 14

    - name: Summary
      run: |
        echo "## Code Quality Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Lint: ${{ steps.lint.outcome }}" >> $GITHUB_STEP_SUMMARY
        echo "- Detekt: ${{ steps.detekt.outcome }}" >> $GITHUB_STEP_SUMMARY
        echo "- ktlint: ${{ steps.ktlint.outcome }}" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # IMPORT ORDER & FORMATTING
  # ============================================
  import-format:
    name: Import Order & Formatting
    runs-on: ubuntu-latest
    needs: [gradle-verify]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check Import Order
      run: |
        echo "Checking Kotlin import order..."
        ./gradlew :app:ktlintMainSourceSetCheck --stacktrace || true
        ./gradlew :common:ktlintMainSourceSetCheck --stacktrace || true
        ./gradlew :server:ktlintMainSourceSetCheck --stacktrace || true

    - name: Check Code Formatting
      run: |
        echo "Running ktlint format check..."
        ./gradlew ktlintCheck --stacktrace || true

    - name: Verify .editorconfig
      run: |
        if [ -f .editorconfig ]; then
          echo ".editorconfig found - import order rules applied"
          cat .editorconfig | grep -A5 "import" || echo "No import rules in .editorconfig"
        else
          echo "Warning: .editorconfig not found"
        fi

  # ============================================
  # SERVER BUILD & TEST
  # ============================================
  server-build:
    name: Build & Test Server
    runs-on: ubuntu-latest
    needs: [gradle-verify, code-quality]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Server
      run: ./gradlew :server:build --stacktrace

    - name: Run Server Tests
      run: ./gradlew :server:test --stacktrace

    - name: Verify Server JAR
      run: |
        if [ -f server/build/libs/server-1.0.0-all.jar ]; then
          echo "Server build successful: server-1.0.0-all.jar"
          ls -lh server/build/libs/
        else
          echo "Warning: Server JAR not found at expected location"
          find server/build -name "*.jar" 2>/dev/null || true
        fi

    - name: Upload Server Build Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: server-build
        path: server/build/libs/
        retention-days: 7

  # ============================================
  # ANDROID BUILD
  # ============================================
  android-build:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: [gradle-verify, code-quality, import-format]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Verify APK
      run: |
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "APK build successful"
          ls -lh app/build/outputs/apk/debug/
        else
          echo "Warning: APK not found at expected location"
          find app/build -name "*.apk" 2>/dev/null || true
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/
        retention-days: 7

    - name: Build Common Module
      run: ./gradlew :common:build --stacktrace

  # ============================================
  # UNIT TESTS
  # ============================================
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [gradle-verify]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Common Module Tests
      run: ./gradlew :common:jvmTest --stacktrace

    - name: Run Server Tests
      run: ./gradlew :server:test --stacktrace

    - name: Run Android Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: |
          app/build/reports/tests/
          app/build/test-results/
          common/build/reports/tests/
          server/build/reports/tests/
        retention-days: 7

    - name: Test Summary
      run: |
        echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "Tests completed at $(date)" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # DOCKER BUILD VERIFICATION
  # ============================================
  docker-verify:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: [server-build]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: |
        docker build -t smarty-server:latest -f Dockerfile . \
          --build-arg GRADLE_ARGS="--no-daemon" \
          || echo "Docker build failed - checking for issues"

    - name: Verify Dockerfile
      run: |
        echo "Dockerfile contents:"
        head -30 Dockerfile

  # ============================================
  # FINAL SUMMARY
  # ============================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [gradle-verify, dependency-check, code-quality, import-format, server-build, android-build, unit-tests]
    if: always()

    steps:
    - name: Generate Summary
      run: |
        echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Gradle Verify | ${{ needs.gradle-verify.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Check | ${{ needs.dependency-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Import Format | ${{ needs.import-format.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Server Build | ${{ needs.server-build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Android Build | ${{ needs.android-build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Completed at: $(date)" >> $GITHUB_STEP_SUMMARY
